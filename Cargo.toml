[workspace]
members = [
    "crates/use-materials",
    "crates/use-density",
    "crates/use-stress",
    "crates/use-strain",
    "crates/use-material-elasticity",
    "crates/use-hardness",
    "crates/use-thermal-expansion",
    "crates/use-conductivity",
    "crates/use-material-property",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-materials"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.dependencies]
use-conductivity = { version = "0.0.1", path = "crates/use-conductivity" }
use-density = { version = "0.0.1", path = "crates/use-density", package = "use-materials-density" }
use-hardness = { version = "0.0.1", path = "crates/use-hardness" }
use-material-elasticity = { version = "0.0.1", path = "crates/use-material-elasticity" }
use-material-property = { version = "0.0.1", path = "crates/use-material-property" }
use-materials = { version = "0.0.2", path = "crates/use-materials" }
use-strain = { version = "0.0.1", path = "crates/use-strain" }
use-stress = { version = "0.0.1", path = "crates/use-stress" }
use-thermal-expansion = { version = "0.0.1", path = "crates/use-thermal-expansion" }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-materials-density",
    "use-stress",
    "use-strain",
    "use-material-elasticity",
    "use-hardness",
    "use-thermal-expansion",
    "use-conductivity",
    "use-material-property",
    "use-materials",
]
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
